server {
    server_name mathplus.com.vn www.mathplus.com.vn;
    client_max_body_size 200M;

    location /documents/ {
        alias /opt/mathplus/public/documents/;
        add_header Access-Control-Allow-Origin *;
        add_header Content-Disposition inline;
        expires 30d;
    }

    location /uploads/ {
        alias /opt/mathplus/public/uploads/;
        add_header Access-Control-Allow-Origin *;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mathplus.com.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mathplus.com.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = mathplus.com.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name mathplus.com.vn www.mathplus.com.vn;
    return 404; # managed by Certbot
}
